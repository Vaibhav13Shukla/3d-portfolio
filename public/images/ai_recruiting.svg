<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" rx="16" fill="#0B0F19"/>
  <rect x="2" y="2" width="1196" height="671" rx="14" fill="none" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="48" rx="16" fill="#060A14"/>
  <circle cx="30" cy="24" r="6" fill="#EF4444"/>
  <circle cx="50" cy="24" r="6" fill="#F59E0B"/>
  <circle cx="70" cy="24" r="6" fill="#10B981"/>
  <text x="600" y="30" fill="#64748B" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="500">AI Recruiting Platform — Multi-Agent Candidate Screening</text>
  
  <!-- Multi-Agent Graph Panel -->
  <rect x="40" y="80" width="1120" height="540" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  <text x="70" y="125" fill="#E2E8F0" font-family="sans-serif" font-size="20" font-weight="700">5-Agent Collaborative Pipeline (CrewAI + FAISS + LangChain)</text>
  
  <!-- Agents Nodes -->
  <g transform="translate(70, 160)">
    <!-- Node 1 -->
    <rect x="0" y="30" width="220" height="120" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="20" y="70" fill="#38BDF8" font-family="sans-serif" font-size="16" font-weight="700">Agent 1: Parser</text>
    <text x="20" y="95" fill="#94A3B8" font-family="sans-serif" font-size="12">Resume Extraction</text>
    <text x="20" y="115" fill="#10B981" font-family="monospace" font-size="11">● Active (12ms)</text>

    <!-- Arrow 1-2 -->
    <path d="M 220 90 L 270 90" stroke="#38BDF8" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Node 2 -->
    <rect x="270" y="30" width="220" height="120" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="290" y="70" fill="#38BDF8" font-family="sans-serif" font-size="16" font-weight="700">Agent 2: Vector Matcher</text>
    <text x="290" y="95" fill="#94A3B8" font-family="sans-serif" font-size="12">FAISS Index Lookup</text>
    <text x="290" y="115" fill="#10B981" font-family="monospace" font-size="11">● Top 5 Ranked</text>

    <!-- Arrow 2-3 -->
    <path d="M 490 90 L 540 90" stroke="#38BDF8" stroke-width="3"/>

    <!-- Node 3 -->
    <rect x="540" y="30" width="220" height="120" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="560" y="70" fill="#38BDF8" font-family="sans-serif" font-size="16" font-weight="700">Agent 3: Screener</text>
    <text x="560" y="95" fill="#94A3B8" font-family="sans-serif" font-size="12">Qualification Verification</text>
    <text x="560" y="115" fill="#10B981" font-family="monospace" font-size="11">● Passed</text>

    <!-- Arrow 3-4 -->
    <path d="M 760 90 L 810 90" stroke="#38BDF8" stroke-width="3"/>

    <!-- Node 4 -->
    <rect x="810" y="30" width="220" height="120" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <text x="830" y="70" fill="#38BDF8" font-family="sans-serif" font-size="16" font-weight="700">Agent 4 &amp; 5: Query Q&amp;A</text>
    <text x="830" y="95" fill="#94A3B8" font-family="sans-serif" font-size="12">Drift Monitor &amp; Alerts</text>
    <text x="830" y="115" fill="#10B981" font-family="monospace" font-size="11">● Sub-100ms response</text>
  </g>
  
  <!-- Stats Panel -->
  <rect x="70" y="360" width="1060" height="220" rx="10" fill="#060A14" stroke="#1E293B" stroke-width="1"/>
  <text x="100" y="405" fill="#E2E8F0" font-family="sans-serif" font-size="18" font-weight="700">Production Performance Metrics</text>
  
  <text x="100" y="455" fill="#38BDF8" font-family="monospace" font-size="14">Concurrent Throughput: 100+ requests/sec</text>
  <text x="100" y="485" fill="#10B981" font-family="monospace" font-size="14">API Latency: 48ms (p95 &lt; 90ms)</text>
  <text x="100" y="515" fill="#E2E8F0" font-family="monospace" font-size="14">Drift Detection: Active monitoring enabled with instant webhooks</text>
  <text x="100" y="545" fill="#64748B" font-family="monospace" font-size="14">Infrastructure: FastAPI + MongoDB + Docker Compose</text>
</svg>
