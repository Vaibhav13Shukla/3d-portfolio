<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" rx="16" fill="#0B0F19"/>
  <rect x="2" y="2" width="1196" height="671" rx="14" fill="none" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Window Header -->
  <rect x="0" y="0" width="1200" height="48" rx="16" fill="#060A14"/>
  <circle cx="30" cy="24" r="6" fill="#EF4444"/>
  <circle cx="50" cy="24" r="6" fill="#F59E0B"/>
  <circle cx="70" cy="24" r="6" fill="#10B981"/>
  <text x="600" y="30" fill="#64748B" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="500">SRE-Bot — Autonomous Incident Remediation Benchmark</text>
  
