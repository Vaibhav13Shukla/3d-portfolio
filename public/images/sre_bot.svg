  <text x="120" y="303" fill="#64748B" font-family="sans-serif" font-size="12">Agent evaluated: Suppressed</text>
  
  <rect x="65" y="355" width="310" height="235" rx="8" fill="#060A14"/>
  <text x="85" y="390" fill="#38BDF8" font-family="monospace" font-size="13">$ pytest --benchmark-eval</text>
  <text x="85" y="420" fill="#10B981" font-family="monospace" font-size="12">[PASS] RewardModel v2</text>
  <text x="85" y="445" fill="#94A3B8" font-family="monospace" font-size="12">  - Action Trajectory: 4 steps</text>
  <text x="85" y="470" fill="#94A3B8" font-family="monospace" font-size="12">  - Isolation Latency: 42ms</text>
  <text x="85" y="495" fill="#38BDF8" font-family="monospace" font-size="12">  - Reward Score: 0.962</text>

  <!-- Right Dashboard Panel -->
  <rect x="430" y="80" width="730" height="540" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  <text x="460" y="120" fill="#E2E8F0" font-family="sans-serif" font-size="20" font-weight="700">Adversarial Evaluation Environment</text>
  
  <!-- Line chart simulation -->
  <path d="M 460 380 Q 560 320 660 350 T 860 220 T 1110 180" fill="none" stroke="#38BDF8" stroke-width="4"/>
  <path d="M 460 380 Q 560 320 660 350 T 860 220 T 1110 180 L 1110 420 L 460 420 Z" fill="url(#blue-grad)" opacity="0.2"/>
  
  <defs>
    <linearGradient id="blue-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="460" y="460" width="210" height="130" rx="8" fill="#1E293B"/>
  <text x="480" y="495" fill="#64748B" font-family="sans-serif" font-size="13">CONCURRENT REQUESTS</text>
  <text x="480" y="535" fill="#38BDF8" font-family="sans-serif" font-size="32" font-weight="800">100+</text>
  
  <rect x="690" y="460" width="210" height="130" rx="8" fill="#1E293B"/>
  <text x="710" y="495" fill="#64748B" font-family="sans-serif" font-size="13">MEAN LATENCY</text>
  <text x="710" y="535" fill="#10B981" font-family="sans-serif" font-size="32" font-weight="800">&lt; 100ms</text>
  
  <rect x="920" y="460" width="240" height="130" rx="8" fill="#1E293B"/>
